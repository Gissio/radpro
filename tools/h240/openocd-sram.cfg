# CMSIS-DAP and generic Cortex-M access for H240 bring-up.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 100
reset_config none

swd newdap h240 cpu -irlen 4
dap create h240.dap -chain-position h240.cpu
target create h240.cpu cortex_m -dap h240.dap

# This session is for memory inspection and explicitly addressed SRAM loads.
gdb_flash_program disable
tcl_port disabled
telnet_port disabled
